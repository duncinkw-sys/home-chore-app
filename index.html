<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Chore App</title>
    <meta name="description" content="Track and manage household chores for your family">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🏠 Our Family Chores</h1>

        <nav class="tabs">
            <button class="tab active" data-tab="weekly">Weekly Chores</button>
            <button class="tab" data-tab="daily">Daily Chores</button>
            <button class="tab" data-tab="monthly">Monthly Chores</button>
            <button class="tab" data-tab="leaderboard">Leaderboard</button>
            <button class="tab" data-tab="settings">Settings</button>
        </nav>

        <!-- WEEKLY CHORES TAB -->
        <section id="tab-weekly" class="tab-content active">
            <div class="chart-header">
                <h2>Weekly Chore Chart</h2>
                <div class="legend">
                    <span class="legend-item"><span class="legend-dot owner"></span> Assigned</span>
                    <span class="legend-item"><span class="legend-dot done"></span> Completed</span>
                </div>
            </div>
            <div class="chore-grid-wrapper">
                <table class="chore-grid" id="weekly-grid">
                    <thead>
                        <tr>
                            <th class="member-col">Member</th>
                            <th>SUN</th><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th>
                        </tr>
                    </thead>
                    <tbody id="weekly-body"></tbody>
                </table>
            </div>
        </section>

        <!-- DAILY CHORES TAB -->
        <section id="tab-daily" class="tab-content">
            <h2>Daily Chores</h2>
            <p class="tab-subtitle">Upkeep &amp; mess prevention — reset every day</p>
            <div id="daily-list" class="checklist"></div>
        </section>

        <!-- MONTHLY CHORES TAB -->
        <section id="tab-monthly" class="tab-content">
            <h2>Monthly / Seasonal Chores</h2>
            <p class="tab-subtitle">Occasional deep maintenance</p>
            <div id="monthly-list" class="checklist"></div>
        </section>

        <!-- LEADERBOARD TAB -->
        <section id="tab-leaderboard" class="tab-content">
            <h2>Leaderboard</h2>
            <div class="leaderboard-style-picker">
                <button class="lb-style-btn active" data-style="racing">Racing</button>
                <button class="lb-style-btn" data-style="scorecard">Scorecard</button>
                <button class="lb-style-btn" data-style="plain">Plain Text</button>
            </div>
            <div id="leaderboard-container"></div>
        </section>

        <!-- SETTINGS TAB -->
        <section id="tab-settings" class="tab-content">
            <h2>Settings</h2>

            <div class="settings-section">
                <h3>Family Members</h3>
                <div class="add-row">
                    <input type="text" id="member-input" placeholder="Add family member...">
                    <button id="add-member-btn">Add</button>
                </div>
                <ul id="member-list" class="settings-list"></ul>
            </div>

            <div class="settings-section">
                <h3>Add Custom Chore</h3>
                <div class="add-row">
                    <input type="text" id="custom-chore-input" placeholder="Chore name...">
                    <select id="custom-chore-freq">
                        <option value="weekly">Weekly</option>
                        <option value="daily">Daily</option>
                        <option value="monthly">Monthly</option>
                    </select>
                    <button id="add-chore-btn">Add</button>
                </div>
            </div>

            <div class="settings-section">
                <h3>Data</h3>
                <button id="reset-btn" class="danger-btn">Reset All Data</button>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
